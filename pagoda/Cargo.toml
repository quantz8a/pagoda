[package]
name = "pagoda"
version = "0.1.0"
edition = "2021"
description = "Zero-dependency LLM inference runtime in pure-std Rust: radix/block prefix cache, continuous batching, KV checkpoint, single-binary offline deploy"
license = "Apache-2.0"
repository = "https://github.com/quantz8a/pagoda"
homepage = "https://quantz8a.github.io/pagoda/"
readme = "README.md"
keywords = ["llm", "inference", "serving", "kv-cache", "offline"]
categories = ["science", "network-programming", "web-programming::http-server"]

[lib]
name = "pagoda"
path = "src/lib.rs"

[[bin]]
name = "pagoda"
path = "src/bin/pagoda.rs"

[profile.release]
lto = true
codegen-units = 1