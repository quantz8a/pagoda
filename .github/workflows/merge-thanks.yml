name: Merge thanks

on:
  pull_request_target:
    types: [closed]

permissions:
  issues: write
  contents: read

jobs:
  thank:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr || !pr.number) return;

            const author = pr.user ? pr.user.login : "contributor";
            const haystack = ((pr.title || "") + "\n" + (pr.body || "")).replace(/\r/g, "");
            const pattern = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#?(\d+)/gi;
            const linked = new Set();
            let match;
            while ((match = pattern.exec(haystack)) !== null) {
              linked.add(parseInt(match[1], 10));
            }

            for (const issueNumber of linked) {
              try {
                const issue = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber
                });
                if (issue.data.pull_request) continue;

                const claimedLabels = (issue.data.labels || [])
                  .map((label) => label.name)
                  .filter((name) => name.startsWith("claimed:"));

                for (const name of claimedLabels) {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    name
                  });
                }

                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  state: "closed"
                });

                const thanks = [
                  "🎉 PR #" + pr.number + " 已合并，感谢 @" + author + " 的贡献。",
                  claimedLabels.length ? "认领标签已释放。" : "",
                  "对应任务已关闭，欢迎继续认领同批任务：https://github.com/" + context.repo.owner + "/" + context.repo.repo + "/issues?q=is%3Aissue+is%3Aopen+label%3A%22good+first+issue%22"
                ].filter(Boolean).join("\n\n");

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: thanks
                });
              } catch (err) {
                console.log("skip issue " + issueNumber + ": " + err.message);
              }
            }